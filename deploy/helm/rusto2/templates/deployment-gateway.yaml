apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rusto2.gateway.fullname" . }}
  labels:
    {{- include "rusto2.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "rusto2.componentSelectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-gateway.yaml") . | sha256sum }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rusto2.componentLabels" (dict "root" . "component" "gateway") | nindent 8 }}
        {{- with .Values.gateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rusto2.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      enableServiceLinks: false
      {{- with .Values.gateway.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "rusto2.image" (dict "root" . "image" .Values.gateway.image) | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: RUSTO2_CONFIG
              value: /etc/rusto2/rusto2.yaml
            - name: RUSTO2_JWKS_URL
              value: {{ include "rusto2.identity.jwksURL" . | quote }}
            - name: RUSTO2_ISSUER
              value: {{ include "rusto2.issuer" . | quote }}
            - name: RUSTO2_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rusto2.identity.secretName" . }}
                  key: RUSTO2_GATEWAY_SECRET
            - name: RUST_LOG
              value: {{ .Values.gateway.logLevel | quote }}
            - name: MIMALLOC_PURGE_DELAY
              value: "0"
            - name: MIMALLOC_ARENA_EAGER_COMMIT
              value: "0"
            {{- with .Values.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.gateway.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.gateway.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.gateway.probes.startup.path | quote }}
              port: http
            periodSeconds: {{ .Values.gateway.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.gateway.probes.liveness.path | quote }}
              port: http
            periodSeconds: {{ .Values.gateway.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.gateway.probes.readiness.path | quote }}
              port: http
            periodSeconds: {{ .Values.gateway.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.gateway.probes.readiness.successThreshold }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rusto2
              readOnly: true
            {{- with .Values.gateway.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "rusto2.gateway.fullname" . }}
            defaultMode: 420
        {{- with .Values.gateway.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
