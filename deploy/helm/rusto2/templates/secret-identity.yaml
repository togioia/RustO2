{{- if not .Values.identity.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rusto2.identity.secretName" . }}
  labels:
    {{- include "rusto2.componentLabels" (dict "root" . "component" "identity") | nindent 4 }}
type: Opaque
data:
  RUSTO2_DEMO_SECRET: {{ include "rusto2.identity.secretValue" (dict "ctx" . "values" .Values.identity.secrets "key" "demoClientSecret" "dataKey" "RUSTO2_DEMO_SECRET") | quote }}
  RUSTO2_READONLY_SECRET: {{ include "rusto2.identity.secretValue" (dict "ctx" . "values" .Values.identity.secrets "key" "readonlyClientSecret" "dataKey" "RUSTO2_READONLY_SECRET") | quote }}
  RUSTO2_GATEWAY_SECRET: {{ include "rusto2.identity.secretValue" (dict "ctx" . "values" .Values.identity.secrets "key" "gatewayClientSecret" "dataKey" "RUSTO2_GATEWAY_SECRET") | quote }}
{{- range $key, $value := .Values.identity.secrets.extra }}
  {{ $key }}: {{ $value | b64enc | quote }}
{{- end }}
{{- end }}
