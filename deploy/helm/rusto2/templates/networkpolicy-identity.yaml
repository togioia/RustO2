{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rusto2.identity.fullname" . }}
  labels:
    {{- include "rusto2.componentLabels" (dict "root" . "component" "identity") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rusto2.componentSelectorLabels" (dict "root" . "component" "identity") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rusto2.componentSelectorLabels" (dict "root" . "component" "gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.monitoring.namespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 9000
    {{- with .Values.networkPolicy.identity.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
